[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nt-pairs"
version = "0.1.0"
description = "Two-leg cross-venue basis oscillation harvester on NautilusTrader"
requires-python = ">=3.12"
dependencies = [
    "nautilus_trader==2.0.0rc6",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"